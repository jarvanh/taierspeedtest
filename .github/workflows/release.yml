name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.6"

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOTOOLCHAIN: local
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME:-dev}"
          ldflags="-s -w -X main.version=${version}"
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$ldflags" -o dist/taierspeedtest-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$ldflags" -o dist/taierspeedtest-linux-arm64 .
          (cd dist && sha256sum taierspeedtest-linux-* > sha256sums.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.0.0-dev.{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('dev {0}', github.run_number) }}
          generate_release_notes: true
          files: |
            dist/taierspeedtest-linux-amd64
            dist/taierspeedtest-linux-arm64
            dist/sha256sums.txt
